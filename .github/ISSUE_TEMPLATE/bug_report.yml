name: Bug report
description: Report a problem with the Eco Coach integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Never share a VIN, bearer token, HTTP headers, raw captures, or personal trip data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Integration version
      options:
        # <!-- AUTOGENERATED_VERSION_OPTIONS_START -->
        - v0.8.0
        - v0.7.5
        - v0.7.4
        - v0.7.3
        - v0.7.2
        - Development branch (unreleased)
        - Other / Older
        # <!-- AUTOGENERATED_VERSION_OPTIONS_END -->
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      description: If you selected an unreleased or older integration, also state its version or commit.
    validations:
      required: true
