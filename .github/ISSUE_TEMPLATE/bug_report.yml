name: Bug report
description: Report a problem with the Eco Coach integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Never share a VIN, bearer token, HTTP headers, raw captures, or personal trip data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Home Assistant and integration versions
    validations:
      required: true
