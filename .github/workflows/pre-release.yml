name: Pre-release

on:
  workflow_run:
    workflows: [CI, Validate with hassfest, Secret scan]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-release
  queue: max
  cancel-in-progress: false

jobs:
  pre-release:
    name: Create Dev Pre-release
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify trusted commit and validation gates
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require('./.github/scripts/release-gate.cjs');
            core.setOutput('ready', await gate({github, context, core}));
      - name: Publish or recover semantic beta
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python .github/scripts/publish_release.py beta --sha "$RELEASE_SHA" --repo "$GITHUB_REPOSITORY"
